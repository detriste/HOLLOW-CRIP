<script>/* Diagnóstico: se algum arquivo faltar ou der erro, a mensagem aparece na tela em vez de ficar tudo preto */
addEventListener('error',function(e){var t=e.target&&e.target.getAttribute&&e.target.getAttribute('src')?'Arquivo não encontrado: '+e.target.getAttribute('src'):e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')';
var d=document.getElementById('erro');if(!d){d=document.createElement('pre');d.id='erro';d.style.cssText='position:fixed;left:8px;top:8px;right:8px;margin:0;padding:10px;background:#300;color:#fdd;font:13px monospace;white-space:pre-wrap;z-index:9';document.body.appendChild(d)}d.textContent+=t+'\n'},true);</script>
